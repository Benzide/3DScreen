
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="src/style.css">
    <title>Face Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
<body>
    <div class="optionContainer">
      <input type="range" min="10" max="75" value="25" class="slider" id="myRange">
      <div id="optionButtonContainer">
        <button class="optionButtons" id="projectionButton">Stop projection</button>
        <button class="optionButtons" id="hideButton">Hide elements</button>
      </div>
    </div>
    <div id="elementContainer">
      <input type="text" id="urlInput">
      <div>
        <button class="optionButtons" id="playButton">Youtube</button>
        <button class="optionButtons" id="pictureButton">Picture</button>
      </div>
    </div>
    <canvas id="fullscreen"></canvas>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
